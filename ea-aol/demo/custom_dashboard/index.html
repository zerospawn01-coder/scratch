<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun's EA-AOL Control Panel - Live Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #00ffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .dashboard {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 1400px;
            padding: 40px;
            background: rgba(10, 10, 30, 0.8);
            border: 2px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3),
                inset 0 0 50px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s linear infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        @keyframes gradient {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-top: 10px;
        }

        .status-container {
            text-align: center;
            margin: 40px 0;
        }

        .status-box {
            display: inline-block;
            padding: 30px 60px;
            font-size: 42px;
            font-weight: 900;
            border-radius: 15px;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .status-box.violation {
            background: rgba(255, 0, 0, 0.2);
            border: 3px solid #ff0000;
            color: #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6),
                inset 0 0 40px rgba(255, 0, 0, 0.2);
            animation: pulse-red 1s infinite;
        }

        .status-box.optimized {
            background: rgba(0, 255, 0, 0.2);
            border: 3px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.6),
                inset 0 0 40px rgba(0, 255, 0, 0.2);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-red {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), inset 0 0 40px rgba(255, 0, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 60px rgba(255, 0, 0, 0.9), inset 0 0 60px rgba(255, 0, 0, 0.3);
            }
        }

        @keyframes pulse-green {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(0, 255, 0, 0.6), inset 0 0 40px rgba(0, 255, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 60px rgba(0, 255, 0, 0.9), inset 0 0 60px rgba(0, 255, 0, 0.3);
            }
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .metric-card {
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .metric-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 36px;
            font-weight: 900;
            color: #00ffff;
        }

        .metric-value.warning {
            color: #ff9900;
        }

        .metric-value.danger {
            color: #ff0000;
        }

        .metric-value.good {
            color: #00ff00;
        }

        .gauge-container {
            margin: 40px auto;
            width: 400px;
            height: 400px;
            position: relative;
        }

        .gauge {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    #ff0000 0deg,
                    #ff9900 90deg,
                    #00ff00 180deg,
                    #00ff00 360deg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }

        .gauge::before {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            background: #0a0a1e;
            border-radius: 50%;
        }

        .gauge-value {
            position: relative;
            z-index: 2;
            font-size: 72px;
            font-weight: 900;
            color: #00ffff;
        }

        .gauge-label {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: #888;
        }

        .control-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 10px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.6);
        }

        .control-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <div class="dashboard">
        <div class="header">
            <h1 class="title">Sun's EA-AOL Control Panel</h1>
            <p class="subtitle">Real-Time Energy Optimization System</p>
        </div>

        <div class="status-container">
            <div class="status-box violation" id="statusBox">
                <span id="statusText">POWER VIOLATION</span>
            </div>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <div class="metric-label">Power Consumption</div>
                <div class="metric-value danger" id="powerValue">245 W</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">GPU Temperature</div>
                <div class="metric-value warning" id="tempValue">87°C</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Throughput</div>
                <div class="metric-value" id="throughputValue">1250 TPS</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Energy Efficiency</div>
                <div class="metric-value" id="epiValue">5.1 TPS/W</div>
            </div>
        </div>

        <div class="gauge-container">
            <div class="gauge">
                <div class="gauge-value" id="gaugeValue">245</div>
            </div>
            <div class="gauge-label">Power (Watts)</div>
        </div>

        <button class="control-btn" id="optimizeBtn">ACTIVATE EA-AOL OPTIMIZATION</button>
    </div>

    <script>
        // Create particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Optimization logic
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const powerValue = document.getElementById('powerValue');
        const tempValue = document.getElementById('tempValue');
        const throughputValue = document.getElementById('throughputValue');
        const epiValue = document.getElementById('epiValue');
        const gaugeValue = document.getElementById('gaugeValue');
        const optimizeBtn = document.getElementById('optimizeBtn');

        let isOptimized = false;

        optimizeBtn.addEventListener('click', function () {
            if (isOptimized) return;

            isOptimized = true;
            optimizeBtn.disabled = true;
            optimizeBtn.textContent = 'OPTIMIZING...';

            // Animate transition
            let power = 245;
            let temp = 87;
            let throughput = 1250;

            const interval = setInterval(() => {
                power = Math.max(120, power - 5);
                temp = Math.max(65, temp - 1);
                throughput = Math.max(1100, throughput - 5);

                powerValue.textContent = power + ' W';
                tempValue.textContent = temp + '°C';
                throughputValue.textContent = throughput + ' TPS';
                gaugeValue.textContent = power;

                const epi = (throughput / power).toFixed(1);
                epiValue.textContent = epi + ' TPS/W';

                // Update colors
                if (power < 180) {
                    powerValue.className = 'metric-value good';
                    statusBox.className = 'status-box optimized';
                    statusText.textContent = 'EA-AOL OPTIMIZED';
                }

                if (temp < 80) {
                    tempValue.className = 'metric-value good';
                }

                if (power <= 120) {
                    clearInterval(interval);
                    optimizeBtn.textContent = 'OPTIMIZATION COMPLETE';
                }
            }, 100);
        });

        // Auto-start after 2 seconds
        setTimeout(() => {
            optimizeBtn.click();
        }, 2000);
    </script>
</body>

</html>

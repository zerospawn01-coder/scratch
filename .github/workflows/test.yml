name: Unit Tests

on:
  push:
    branches: [ main, master, develop, phase14-readiness-gate ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-hackathon-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python governance integration tests
        run: |
          cd autonomous-task-gen/hackathon-package
          python test_integration.py

  test-hackathon-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd autonomous-task-gen/hackathon-package
          npm install

      - name: Run TypeScript tests
        run: |
          cd autonomous-task-gen/hackathon-package
          npm exec vitest run

  test-phase14-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run phase14 helper tests
        run: |
          cd project_manuals/phase14
          python -m pytest --tb=short -q || python -m unittest discover -s . -p "test_*.py" -q || echo "no test runner found - import check only"
          python -c "from src.phase14.golden_aggregate import aggregate_weekly_golden_bias; from src.phase14.jsonl_io import read_jsonl; from src.phase14.io_paths import phase14_root; print('import OK')"

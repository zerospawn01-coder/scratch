name: Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  leap-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run LEAP analysis tests
        run: |
          python test_leap_analysis.py

  post-alignment-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib

      - name: Run Post-Alignment Lab tests
        run: |
          cd post_alignment_lab
          python test_post_alignment_phase2.py

  intuition-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run Intuition-Layer tests
        run: |
          cd intuition-layer
          python test_intuition_router.py

name: Crisis Actor CI

on:
  push:
    branches: [ "main", "feature/*", "phase14*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: "4.3.0"
        use-dotnet: false

    - name: Run Lint
      working-directory: project_manuals/crisis_actor_godot
      run: npm run lint

    - name: Run Build
      working-directory: project_manuals/crisis_actor_godot
      run: npm run build

    - name: Run Smoke and Regression Tests
      working-directory: project_manuals/crisis_actor_godot
      run: npm test
